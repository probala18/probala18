<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00f5a0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(360px); }
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .mono {
        font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Monaco, Consolas, "Courier New", monospace;
      }
      .title { font-weight: 700; fill: #58a6ff; }
      .prompt { fill: #00f5a0; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .dim { fill: #8b949e; }
      .cyan { fill: #38bdf8; }
      .green { fill: #34d399; }
      .white { fill: #e6edf3; }
      .accent { fill: #7ee787; }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="2" y="2" width="846" height="356" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Glow Border Accent -->
  <rect x="2" y="2" width="846" height="356" rx="12" fill="none" stroke="url(#accentGlow)" stroke-width="1" />

  <!-- Window Header Bar -->
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 836 2 C 842.63 2 848 7.37 848 14 L 848 42 L 2 42 Z" fill="url(#headerGrad)" stroke="#30363d" stroke-width="1" />

  <!-- Terminal Window Buttons -->
  <circle cx="24" cy="22" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="44" cy="22" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="64" cy="22" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="425" y="26" text-anchor="middle" class="mono dim" font-size="12" letter-spacing="1">balasundar@probala18: ~/workspace</text>

  <!-- Status Indicator Pill -->
  <g transform="translate(730, 13)">
    <rect width="96" height="18" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="12" cy="9" r="3.5" fill="#00f5a0" />
    <text x="22" y="13" class="mono green" font-size="9.5" font-weight="600" letter-spacing="0.5">DEV_ACTIVE</text>
  </g>

  <!-- Inner Terminal Body -->
  <!-- Command 1: initialization -->
  <g transform="translate(30, 74)">
    <text x="0" y="0" class="mono prompt" font-size="13">visitor@terminal:~$</text>
    <text x="175" y="0" class="mono cmd" font-size="13">./init_identity.sh --target=probala18</text>
  </g>

  <!-- Large ASCII / Header Branding -->
  <g transform="translate(30, 120)">
    <!-- Main Display Name -->
    <text x="0" y="0" class="mono title" font-size="28" font-weight="800" letter-spacing="2">BALASUNDAR</text>
    <text x="220" y="-3" class="mono dim" font-size="14">|</text>
    <text x="238" y="-2" class="mono cyan" font-size="13" font-weight="600" letter-spacing="1.5">FRONTEND &amp; AI SOFTWARE ENGINEER</text>

    <!-- Subtitle summary -->
    <text x="0" y="24" class="mono dim" font-size="12.5">Pursuing Artificial Intelligence &amp; Data Science &bull; Engineering intelligent web applications</text>
  </g>

  <!-- Technical Specs Box (CyberGorad-inspired tree structure) -->
  <g transform="translate(30, 185)" class="mono" font-size="12.5">
    <!-- Row 1 -->
    <text x="0" y="0" class="cyan">┌──</text>
    <text x="32" y="0" class="dim">STACK_FRONTEND</text>
    <text x="165" y="0" class="dim">::</text>
    <text x="185" y="0" class="white">React &bull; Next.js &bull; TypeScript &bull; Tailwind CSS &bull; GSAP &bull; Framer Motion</text>

    <!-- Row 2 -->
    <text x="0" y="25" class="cyan">├──</text>
    <text x="32" y="25" class="dim">STACK_AI_CORE</text>
    <text x="165" y="25" class="dim">::</text>
    <text x="185" y="25" class="green">Python &bull; LLM Orchestration &bull; Page-Aware RAG &bull; AI Agents &bull; LangChain</text>

    <!-- Row 3 -->
    <text x="0" y="50" class="cyan">├──</text>
    <text x="32" y="50" class="dim">BACKEND_DATA</text>
    <text x="165" y="50" class="dim">::</text>
    <text x="185" y="50" class="white">FastAPI &bull; Node.js &bull; Express &bull; SQLite &bull; Git &bull; Docker</text>

    <!-- Row 4 -->
    <text x="0" y="75" class="cyan">└──</text>
    <text x="32" y="75" class="dim">SYSTEM_STATUS</text>
    <text x="165" y="75" class="dim">::</text>
    <text x="185" y="75" class="accent">Actively shipping open-source intelligence tools</text>
  </g>

  <!-- Interactive Terminal Prompt Footer with Blinking Cursor -->
  <g transform="translate(30, 310)">
    <line x1="0" y1="-18" x2="790" y2="-18" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4" />
    <text x="0" y="10" class="mono prompt" font-size="13">visitor@terminal:~$</text>
    <text x="175" y="10" class="mono cmd" font-size="13">cat projects_index.json | grep --color=always "FEATURED"</text>
    <rect x="670" y="-3" width="9" height="16" fill="#00f5a0" class="cursor" />
  </g>
</svg>
